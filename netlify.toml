# Netlify Configuration for YETI Ad Generator Frontend

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# ==============================================================================
# GOOGLE CLOUD RUN BACKEND PROXY
# ==============================================================================
# The Netlify frontend proxies API calls directly to the serverless Google Cloud Run
# service instance (`yeti-ad-backend`). This eliminates CORS preflight complexity
# in production and keeps the API surface unified under https://yeti-ad-generator.netlify.app/api/*
# ==============================================================================

# Proxy /api requests to live Google Cloud Run backend
[[redirects]]
  from = "/api/*"
  to = "https://yeti-ad-backend-545916247776.us-central1.run.app/api/:splat"
  status = 200
  force = true

# Proxy /outputs requests to live Google Cloud Run backend
[[redirects]]
  from = "/outputs/*"
  to = "https://yeti-ad-backend-545916247776.us-central1.run.app/outputs/:splat"
  status = 200
  force = true

# Redirect SPA routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
